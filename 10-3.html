<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王宇智的媒体查询演示</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        html {
            font-size: 16px;
        }

        .viewport-box {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem;
            background: #3b82f6;
            color: #fff;
            text-align: center;
            font-family: "Microsoft YaHei", sans-serif;
            transition: background-color 0.4s ease;
        }

        h1 {
            margin: 0;
            font-size: 4rem;
        }

        p {
            margin: 0;
            font-size: 1.25rem;
        }

        .size-label::after {
            content: "当前：大屏幕";
        }

        @media (max-width: 900px) {
            html {
                font-size: 14px;
            }

            .viewport-box {
                background: #8b5cf6;
            }

            .size-label::after {
                content: "当前：平板或中等屏幕";
            }
        }

        @media (max-width: 600px) {
            html {
                font-size: 12px;
            }

            .viewport-box {
                background: #ec4899;
            }

            .size-label::after {
                content: "当前：手机小屏幕";
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .viewport-box {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="viewport-box">
        <h1>王宇智</h1>
        <p>调整浏览器视口大小，观察背景颜色变化</p>
        <p class="size-label" aria-live="polite"></p>
    </main>
</body>
</html>
