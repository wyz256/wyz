<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation - 极光流光盒子</title>
    <style>
        @property --glow-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #101426;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .color-box {
            position: relative;
            isolation: isolate;
            width: min(340px, 80vw);
            height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border: 1px solid rgb(255 255 255 / 30%);
            border-radius: 24px;
            color: #fff;
            background: linear-gradient(
                125deg,
                #ff4d8d,
                #ffb347,
                #6d5dfc,
                #00d4c7,
                #ff4d8d
            );
            background-size: 300% 300%;
            box-shadow: 0 20px 60px rgb(0 0 0 / 35%);
            animation: aurora-flow 8s ease-in-out infinite, float 4s ease-in-out infinite;
        }

        .color-box::before {
            position: absolute;
            z-index: -1;
            inset: -5px;
            border-radius: inherit;
            background: conic-gradient(
                from var(--glow-angle, 0deg),
                #ff4d8d,
                #ffb347,
                #6d5dfc,
                #00d4c7,
                #ff4d8d
            );
            filter: blur(18px);
            opacity: 0.8;
            content: "";
            animation: glow-spin 6s linear infinite;
        }

        .color-box strong {
            font-size: 28px;
            letter-spacing: 4px;
            text-shadow: 0 2px 16px rgb(0 0 0 / 25%);
        }

        .color-box span {
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.85;
        }

        @keyframes aurora-flow {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }
            50% {
                transform: translateY(-12px) rotate(2deg);
            }
        }

        @keyframes glow-spin {
            to {
                --glow-angle: 360deg;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .color-box {
                animation: none;
                background-position: 50% 50%;
            }
            .color-box::before {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="color-box">
        <strong>COLOR FLOW</strong>
        <span>纯 CSS 极光流动动画</span>
    </div>
</body>
</html>
