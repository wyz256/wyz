<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>308 王宇智</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            /* 盒子内部留白8px */
            padding: 8px;
            /* 灰色1px实线边框 */
            border: 1px solid #ccc;
            /* 盒子内基础文字大小12px */
            font-size: 12px;
            /* 盒子外部外边距20px，和别的元素隔开 */
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            /* 文字居中 */
            text-align: center;
            line-height: 33px;
            /* 文字之间间距3px（字间距） */
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            /* 行高 */
            line-height: 150%;
            color: #666;
            /* 首行缩进 */
            text-indent: 2em;
        }
        #box a{
            color: #f11;
            /* 取消链接默认下划线 */
            text-decoration: none;
            /* 加粗 */
            font-weight: bold;
        }
        .stu-id{
            color:blue;
            font-weight: bold;
        }
        .name{
            color:#036;
            font-weight: bold;
        }
        .level{
            color: #f11;
            font-weight: bold;
        }
        .know{
             border: 2px solid purple;
        }
    </style>
</head>
<body>
    <h2>CSS进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
       <p>
    <span class="stu-id">学号：0308</span>，
    <span class="name">姓名：王宇智</span>，
    班级：计算机24003，对于《高级网页设计》课程的难度认知为：<span class="level">难</span>，
    <span>这个例子对应的知识点是：</span>
<span class="know">群组选择器、后代选择器、层叠与继承。</span>
<a href="#">更多>></a>

    <a href="#">更多>></a>
</p>

    </div>

</body>
</html>
