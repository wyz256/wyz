<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="index.html">← 返回首页</a>
    <h2>王宇智的JavaScript</h2>
    <script>
        document.write("<h3>hello world,王宇智</h3>");
        alert("hello world");
        console.log("hello world,王宇智");
        //prompt和confirm方法
        //prompt方法用于获取用户输入的信息
        //confirm方法用于确认用户操作是否执行
        var wang_name = prompt("请输入您的姓名");
        alert("您的姓名是：" + wang_name);
        var wang_isConfirm = confirm("您确定是18岁以上吗？");
        if(wang_isConfirm){
            alert("您是18岁以上的人");
        }else{
            alert("您不是18岁以上的人");
        }
    </script>
</body>
</html>
