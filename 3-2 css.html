<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>308 王宇智</title>
    <style>
        p{
            color: black;
            font-size:50px;
        }
        /* 标签选择器 */
        #box{
            width:600px;
            height:500px;
            background-color:red;
        }
           /* id选择器 */
           .n1{
            color: aqua;
           }
           .n2{
            color: bisque;
           }
           .n3{
            color: blueviolet;
           }
           h2{
            color:aliceblue;
            background-color: black;
           }
           .sel{
    color:white;
}
            .box2{
    width: 300px;
    height: 300px;
    background-color: orange;
}


    </style>
</head>
<body>
     <h2>层叠样式表 CSS</h2>
     <div id="box">
        <p>CSS<span class="sel">选择器</span></p>
        <p><span class="n1">王</span><span class="n2">宇</span><span class="n3">智</span></p>
        <p>CSS属性</p>

     </div>
     <div class="box2"></div>
     <!-- 拓展1：名字的每一个字不同颜色，在同一行 -->
      <!-- 拓展2：h2黑底白字 -->
       <!-- 拓展三：选择器三个字是白色 -->
</body>
</html>
